[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openpulse-standard"
version = "0.1.0"
description = "OpenPulse Standard reference implementation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "clickhouse-connect>=0.8.6",
  "confluent-kafka>=2.5.0",
  "boto3>=1.35.0",
  "python-dateutil>=2.9.0",
  "httpx>=0.27.0",
  "redis>=5.0.8",
  "tenacity>=9.0.0",
  "structlog>=24.4.0",
  "prometheus-client>=0.20.0",
  "orjson>=3.10.0",
  "python-json-logger>=2.0.7",
  "PyYAML>=6.0.2",
  "jinja2>=3.1.4"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.23.8",
  "pytest-cov>=5.0.0",
  "hypothesis>=6.112.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
  "jsonschema>=4.23.0",
  "locust>=2.31.0"
]

[tool.setuptools]
packages = []

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = [".", "packages/openpulse_core", "packages/openpulse_data"]
addopts = "-q"
