services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - "1G"
      - --reserve-memory
      - "0M"
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092,OUTSIDE://localhost:19092
      - --pandaproxy-addr
      - 0.0.0.0:8082
      - --advertise-pandaproxy-addr
      - redpanda:8082
    ports:
      - "19092:19092"
      - "19644:9644"

  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    depends_on:
      - redpanda
    entrypoint: >
      /bin/sh -c "
      until rpk cluster info -X brokers=redpanda:9092; do sleep 2; done;
      rpk topic create openpulse.raw.ingest -p 3 -r 1 -X brokers=redpanda:9092 || true;
      rpk topic create openpulse.normalized.observation -p 3 -r 1 -X brokers=redpanda:9092 || true;
      exit 0;
      "

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_DB: openpulse
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-openpulse}
    volumes:
      - ./data-platform/clickhouse/init:/docker-entrypoint-initdb.d
      - clickhouse_data:/var/lib/clickhouse
    ports:
      - "8123:8123"
      - "9002:9000"

  minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: openpulse
      MINIO_ROOT_PASSWORD: openpulse123
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  minio-init:
    image: minio/mc:RELEASE.2024-09-16T17-43-14Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set openpulse http://minio:9000 openpulse openpulse123; do sleep 2; done;
      /usr/bin/mc mb --ignore-existing openpulse/openpulse-bronze;
      /usr/bin/mc anonymous set private openpulse/openpulse-bronze;
      exit 0;
      "

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"

  ingestion-gateway:
    build: .
    env_file: .env.example
    working_dir: /app/services/ingestion-gateway
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    depends_on:
      - redpanda
      - redpanda-init
      - redis

  connector-service:
    build: .
    env_file: .env.example
    working_dir: /app/services/connector-service
    command: uvicorn app.main:app --host 0.0.0.0 --port 8002
    ports:
      - "8002:8002"
    depends_on:
      - ingestion-gateway

  normalization-service:
    build: .
    env_file: .env.example
    working_dir: /app/services/normalization-service
    command: python -m app.worker
    depends_on:
      - redpanda
      - redpanda-init
      - clickhouse
      - minio

  query-api:
    build: .
    env_file: .env.example
    working_dir: /app/services/query-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8003
    ports:
      - "8003:8003"
    depends_on:
      - clickhouse

  consent-identity-service:
    build: .
    env_file: .env.example
    working_dir: /app/services/consent-identity-service
    command: uvicorn app.main:app --host 0.0.0.0 --port 8004
    ports:
      - "8004:8004"
    depends_on:
      - clickhouse

  governance-agent:
    build: .
    env_file: .env.example
    working_dir: /app/services/governance-agent
    command: uvicorn app.main:app --host 0.0.0.0 --port 8005
    ports:
      - "8005:8005"

  ehr-integration:
    build: .
    env_file: .env.example
    working_dir: /app/services/ehr-integration
    command: uvicorn app.main:app --host 0.0.0.0 --port 8006
    ports:
      - "8006:8006"
    depends_on:
      - query-api

  ops-console:
    build: .
    env_file: .env.example
    working_dir: /app/services/ops-console
    command: uvicorn app.main:app --host 0.0.0.0 --port 8007
    ports:
      - "8007:8007"
    depends_on:
      - query-api
      - governance-agent

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  clickhouse_data:
  minio_data:
