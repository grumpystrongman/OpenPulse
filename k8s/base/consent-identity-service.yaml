apiVersion: apps/v1
kind: Deployment
metadata:
  name: consent-identity-service
  namespace: openpulse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: consent-identity-service
  template:
    metadata:
      labels:
        app: consent-identity-service
    spec:
      containers:
        - name: consent-identity-service
          image: openpulse/standard:0.1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: openpulse-env
          workingDir: /app/services/consent-identity-service
          command: ["sh", "-c", "uvicorn app.main:app --host 0.0.0.0 --port 8004"]
---
apiVersion: v1
kind: Service
metadata:
  name: consent-identity-service
  namespace: openpulse
spec:
  selector:
    app: consent-identity-service
  ports:
    - name: http
      port: 8004
      targetPort: 8004

