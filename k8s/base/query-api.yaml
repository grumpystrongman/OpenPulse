apiVersion: apps/v1
kind: Deployment
metadata:
  name: query-api
  namespace: openpulse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: query-api
  template:
    metadata:
      labels:
        app: query-api
    spec:
      containers:
        - name: query-api
          image: openpulse/standard:0.1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: openpulse-env
          workingDir: /app/services/query-api
          command: ["sh", "-c", "uvicorn app.main:app --host 0.0.0.0 --port 8003"]
---
apiVersion: v1
kind: Service
metadata:
  name: query-api
  namespace: openpulse
spec:
  selector:
    app: query-api
  ports:
    - name: http
      port: 8003
      targetPort: 8003

