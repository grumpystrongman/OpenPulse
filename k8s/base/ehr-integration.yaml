apiVersion: apps/v1
kind: Deployment
metadata:
  name: ehr-integration
  namespace: openpulse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ehr-integration
  template:
    metadata:
      labels:
        app: ehr-integration
    spec:
      containers:
        - name: ehr-integration
          image: openpulse/standard:0.1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: openpulse-env
          workingDir: /app/services/ehr-integration
          command: ["sh", "-c", "uvicorn app.main:app --host 0.0.0.0 --port 8006"]
---
apiVersion: v1
kind: Service
metadata:
  name: ehr-integration
  namespace: openpulse
spec:
  selector:
    app: ehr-integration
  ports:
    - name: http
      port: 8006
      targetPort: 8006

